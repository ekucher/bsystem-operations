server {
  listen 8080;
  server_name _;

  absolute_redirect off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    # Resolve the Docker service at request time so nginx can start while
    # the API is temporarily unavailable and recover without restart.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    set $operations_api_upstream api;
    proxy_pass http://$operations_api_upstream:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
