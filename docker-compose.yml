services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DB_PATH: "/data/operations.sqlite3"
      # Local dev only — set real secrets via .env / deployment config,
      # never commit them.
      OPERATIONS_BOOTSTRAP_SECRET: "${OPERATIONS_BOOTSTRAP_SECRET:-dev-bootstrap-secret}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DISCORD_ALERTS_WEBHOOK_URL: "${DISCORD_ALERTS_WEBHOOK_URL:-}"
      OFFLINE_CHECK_INTERVAL_MINUTES: "${OFFLINE_CHECK_INTERVAL_MINUTES:-5}"
    volumes:
      - operations-data:/data

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      - api

volumes:
  operations-data:
