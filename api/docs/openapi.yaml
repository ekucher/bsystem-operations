openapi: 3.0.3
info:
  title: BSYSTEM Operations API
  version: 0.1.0
  description: >
    Fleet-моніторинг серверів BRAVO-Toolkit (backup, LIMS/VetOffice
    maintenance, health/статус служб). Standalone v1 — без інтеграції з
    Integration Core/Module Registry (див. README).
servers:
  - url: /api/v1

components:
  securitySchemes:
    bootstrapSecret:
      type: apiKey
      in: header
      name: X-Bootstrap-Secret
      description: Видається адміністратором Operations разом з увімкненням opt-in на сервері.
    sessionCookie:
      type: apiKey
      in: cookie
      name: ops_session
      description: >
        Etap 3: httpOnly-сесія локального облікового запису, видається
        POST /auth/login. Роль (admin|viewer) визначає доступ —
        approve вимагає admin, решта адмін-маршрутів доступні обом.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Виданий після approve/reissue. Спочатку доступний через
        GET /enroll/{serverId} протягом обмеженого вікна (5 хв, TTL —
        не reveal-once), або одразу в тілі відповіді POST
        /admin/servers/{serverId}/reissue.
    enrollmentClaim:
      type: apiKey
      in: header
      name: X-Enrollment-Claim
      description: >
        Видається (і за потреби перевидається) у відповіді POST /enroll,
        доки сервер ще pending. Прив'язує GET /enroll/{serverId} саме до
        того enrollment-виклику, що його створив — володіння лише
        bootstrapSecret більше не є достатнім для читання чужого ключа
        за відомим/вгаданим GUID.

  schemas:
    ProductType:
      type: string
      enum: [LIMS, VETOFFICE]
    ServerStatus:
      type: string
      enum: [pending, approved, revoked]
    Severity:
      type: string
      enum: [SUCCESS, WARNING, ERROR, CRITICAL]
    EventCategory:
      type: string
      enum: [backup, maintenance, health]
    UserRole:
      type: string
      enum: [admin, viewer]
    ServiceStatusEntry:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: exchangAPI
        status:
          type: string
          enum: [running, stopped, unknown]
    EventPayload:
      type: object
      required: [message]
      properties:
        message:
          type: string
        component:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatusEntry'
        details:
          type: object
          additionalProperties: true

paths:
  /auth/login:
    post:
      summary: Вхід локальним обліковим записом (Etap 3). Немає self-registration — акаунти лише через CLI create-admin.
      # Explicit "no auth required" (this IS the auth endpoint) — an
      # empty array, not an omitted `security` key, so spec-linters (see
      # F8's redocly lint CI step) can tell "intentionally public" apart
      # from "someone forgot to document the auth requirement".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Вхід успішний, ops_session cookie встановлено
        '400':
          description: Невалідний запит
        '401':
          description: Невірний логін/пароль

  /auth/logout:
    post:
      summary: Вихід — видаляє сесію та cookie
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Вихід виконано
        '401':
          description: Немає активної сесії

  /auth/me:
    get:
      summary: Поточний обліковий запис (username + role)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: username + role
        '401':
          description: Немає активної сесії

  /enroll:
    post:
      summary: >
        Self-enrollment сервера (GUID). Bootstrap-секрет передається
        ТІЛЬКИ через заголовок X-Bootstrap-Secret (єдиний канонічний
        транспорт для обох /enroll-маршрутів — раніше POST приймав його
        в тілі, а GET у заголовку; тепер узгоджено).
      security:
        - bootstrapSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverId, institutionCode, productType, hostname]
              properties:
                serverId:
                  type: string
                  format: uuid
                institutionCode:
                  type: string
                productType:
                  $ref: '#/components/schemas/ProductType'
                hostname:
                  type: string
      responses:
        '202':
          description: >
            Прийнято. Поки сервер pending — ідемпотентно, повторний виклик
            оновлює hostname/institutionCode і ПЕРЕВИДАЄ claimToken
            (відповідь: { status, claimToken }). Після approve/revoke
            ідентичність більше не мутується через цей маршрут — див. 409.
        '400':
          description: Невалідний запит
        '401':
          description: Невірний bootstrap-секрет (передано не в тому заголовку, або взагалі не передано)
        '409':
          description: >
            Сервер вже approved або revoked — повторний POST /enroll для
            цього id більше не скидає й не переписує його ідентичність;
            потрібна дія адміністратора (revoke/reissue).
        '503':
          description: Enrollment не сконфігуровано (OPERATIONS_BOOTSTRAP_SECRET відсутній)

  /enroll/{serverId}:
    get:
      summary: >
        Поллінг статусу enrollment. apiKey повертається, поки не минув
        TTL (5 хв від approve/reissue) — це НЕ reveal-once: той самий
        claim може повторно прочитати ключ у межах вікна, щоб пережити
        втрачену відповідь. Вимагає ОБИДВА: X-Bootstrap-Secret (весь
        флот) і X-Enrollment-Claim (саме цей enrollment, з відповіді
        POST /enroll).
      security:
        - bootstrapSecret: []
        - enrollmentClaim: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Enrollment-Claim
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Статус (+ apiKey, лише поки approved і в межах TTL-вікна)
        '401':
          description: Невірний bootstrap-секрет
        '404':
          description: >
            Сервер не знайдений, АБО revoked, АБО claim відсутній/невірний —
            навмисно одна й та сама відповідь для всіх трьох випадків,
            щоб володіння лише bootstrap-секретом не давало змоги
            відрізнити "не існує" від "чужий/відкликаний enrollment".

  /admin/servers:
    get:
      summary: >
        Список усіх серверів для overview (Etap 3): кожен запис
        збагачено isOnline (з last_heartbeat_at) і latestByCategory
        (останній backup/maintenance/health-запис). Доступно admin і
        viewer.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Масив серверів + heartbeatExpectedIntervalMinutes/heartbeatMissedThreshold
        '401':
          description: Немає активної сесії

  /admin/servers/{serverId}:
    get:
      summary: >
        Деталі сервера для detail-режиму (Etap 3): останні 1000 подій,
        latestByCategory, isOnline, і (з D4) recentActions — до 20
        останніх записів admin_actions (approve/revoke/reissue) для
        цього сервера. Доступно admin і viewer.
      security:
        - sessionCookie: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Сервер, latestByCategory, його події та recentActions
        '401':
          description: Немає активної сесії
        '404':
          description: Не знайдено

  /admin/servers/{serverId}/approve:
    post:
      summary: Підтвердити pending-сервер, видати API-ключ. Лише роль admin.
      security:
        - sessionCookie: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved
        '401':
          description: Немає активної сесії
        '403':
          description: Сесія є, але роль не admin
        '404':
          description: Не знайдено
        '409':
          description: Сервер не у статусі pending

  /admin/servers/{serverId}/revoke:
    post:
      summary: >
        Відкликати сервер (D4). Дійсно з pending (відхилити enrollment)
        або approved (вимкнути активного агента). Очищає api_key_hash,
        pending_api_key і enrollment_claim_hash — жодним чином не може
        далі автентифікуватись чи бути опитаним. Лише роль admin. Пише
        рядок в admin_actions.
      security:
        - sessionCookie: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Revoked
        '400':
          description: Невалідний запит
        '401':
          description: Немає активної сесії
        '403':
          description: Сесія є, але роль не admin
        '404':
          description: Не знайдено
        '409':
          description: Сервер вже revoked

  /admin/servers/{serverId}/reissue:
    post:
      summary: >
        Видати новий API-ключ (D4): ротація для approved (скомпрометований
        /втрачений ключ) або контрольоване un-revoke для revoked сервера
        (лише за явною дією admin, ніколи автоматично). Новий ключ
        повертається одразу у відповіді (це вже автентифікована
        admin-дія, не self-service агента). Лише роль admin. Пише рядок
        в admin_actions.
      security:
        - sessionCookie: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: '{ status: "approved", apiKey }'
        '400':
          description: Невалідний запит
        '401':
          description: Немає активної сесії
        '403':
          description: Сесія є, але роль не admin
        '404':
          description: Не знайдено
        '409':
          description: Сервер ще pending — спершу approve

  /events:
    post:
      summary: >
        Прийом подій від агента (Archive/BazaSync/Maintenance/Health) —
        ЗАВЖДИ, незалежно від NotificationMode Discord-провайдера
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, severity, payload]
              properties:
                category:
                  $ref: '#/components/schemas/EventCategory'
                severity:
                  $ref: '#/components/schemas/Severity'
                payload:
                  $ref: '#/components/schemas/EventPayload'
                eventId:
                  type: string
                  maxLength: 200
                  description: >
                    Опціональний (E4/E5) — стабільний ідентифікатор події
                    від агента (напр. з локального durable outbox).
                    Разом із серверним serverId гарантує ідемпотентний
                    прийом: повторний POST з тим самим eventId (напр. після
                    retry, коли перша відповідь загубилась) не створює
                    дубль у БД, а повертає той самий 202.
                occurredAt:
                  type: string
                  format: date-time
                  description: >
                    Опціональний (E7) — момент фактичної події на
                    стороні агента, окремо від моменту отримання API
                    (created_at). Важливо для подій, що були надіслані
                    із затримкою через локальний outbox під час
                    недоступності Operations.
                schemaVersion:
                  type: integer
                  minimum: 1
                  description: Опціональна версія конверта події зі сторони агента.
      responses:
        '202':
          description: Прийнято (ідемпотентно за eventId, якщо передано)
        '400':
          description: Невалідний payload
        '401':
          description: Невірний/відкликаний API-ключ

  /heartbeat:
    post:
      summary: Періодичний heartbeat (незалежно від подій) — джерело для offline-детекції (Etap 4)
      security:
        - apiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bravoVersion:
                  type: string
      responses:
        '202':
          description: Прийнято
        '401':
          description: Невірний/відкликаний API-ключ
